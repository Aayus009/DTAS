<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820">
<style>
  .t { font-family: 'Times New Roman', Times, serif; fill: #000; }
  .title { font-size: 22px; font-weight: bold; }
  .sub { font-size: 13px; }
  .sys { font-size: 14px; font-weight: bold; }
  .uc { font-size: 12px; }
  .act { font-size: 13px; font-weight: bold; }
  .rel { font-size: 11px; font-style: italic; }
  .note { font-size: 11px; }
</style>
<rect x="0" y="0" width="1400" height="820" fill="#fff"/>
<text class="t title" x="700.0" y="36" text-anchor="middle">Figure UC-5. Clubs and Connect</text>
<text class="t sub" x="700.0" y="58" text-anchor="middle">Campus users create clubs. Admin may restrict a club but cannot create one.</text>
<rect x="300" y="90" width="800" height="660" fill="#fff" stroke="#000" stroke-width="1.8"/>
<text class="t sys" x="700.0" y="112" text-anchor="middle">DTAS Clubs and Connect</text>
<circle cx="110" cy="220" r="10" fill="#fff" stroke="#000" stroke-width="1.6"/>
<line x1="110" y1="230" x2="110" y2="258" stroke="#000" stroke-width="1.6"/>
<line x1="94" y1="242" x2="126" y2="242" stroke="#000" stroke-width="1.6"/>
<line x1="110" y1="258" x2="96" y2="278" stroke="#000" stroke-width="1.6"/>
<line x1="110" y1="258" x2="124" y2="278" stroke="#000" stroke-width="1.6"/>
<text class="t act" x="110" y="296" text-anchor="middle">Campus user</text>
<circle cx="110" cy="520" r="10" fill="#fff" stroke="#000" stroke-width="1.6"/>
<line x1="110" y1="530" x2="110" y2="558" stroke="#000" stroke-width="1.6"/>
<line x1="94" y1="542" x2="126" y2="542" stroke="#000" stroke-width="1.6"/>
<line x1="110" y1="558" x2="96" y2="578" stroke="#000" stroke-width="1.6"/>
<line x1="110" y1="558" x2="124" y2="578" stroke="#000" stroke-width="1.6"/>
<text class="t act" x="110" y="596" text-anchor="middle">Club lead</text>
<circle cx="1290" cy="360" r="10" fill="#fff" stroke="#000" stroke-width="1.6"/>
<line x1="1290" y1="370" x2="1290" y2="398" stroke="#000" stroke-width="1.6"/>
<line x1="1274" y1="382" x2="1306" y2="382" stroke="#000" stroke-width="1.6"/>
<line x1="1290" y1="398" x2="1276" y2="418" stroke="#000" stroke-width="1.6"/>
<line x1="1290" y1="398" x2="1304" y2="418" stroke="#000" stroke-width="1.6"/>
<text class="t act" x="1290" y="436" text-anchor="middle">System Admin</text>
<ellipse cx="520" cy="160" rx="140" ry="28" fill="#fff" stroke="#000" stroke-width="1.5"/>
<text class="t uc" x="520" y="160" text-anchor="middle">Create club</text>
<ellipse cx="520" cy="250" rx="140" ry="28" fill="#fff" stroke="#000" stroke-width="1.5"/>
<text class="t uc" x="520" y="243" text-anchor="middle">Request to join</text>
<text class="t uc" x="520" y="257" text-anchor="middle">public club</text>
<ellipse cx="520" cy="360" rx="140" ry="28" fill="#fff" stroke="#000" stroke-width="1.5"/>
<text class="t uc" x="520" y="360" text-anchor="middle">Join with invite code</text>
<ellipse cx="520" cy="460" rx="140" ry="28" fill="#fff" stroke="#000" stroke-width="1.5"/>
<text class="t uc" x="520" y="460" text-anchor="middle">Leave club</text>
<ellipse cx="520" cy="560" rx="140" ry="28" fill="#fff" stroke="#000" stroke-width="1.5"/>
<text class="t uc" x="520" y="560" text-anchor="middle">Open Connect group</text>
<ellipse cx="800" cy="220" rx="145" ry="30" fill="#fff" stroke="#000" stroke-width="1.5"/>
<text class="t uc" x="800" y="213" text-anchor="middle">Approve or decline</text>
<text class="t uc" x="800" y="227" text-anchor="middle">join requests</text>
<ellipse cx="800" cy="360" rx="145" ry="28" fill="#fff" stroke="#000" stroke-width="1.5"/>
<text class="t uc" x="800" y="360" text-anchor="middle">Invite members</text>
<ellipse cx="800" cy="480" rx="145" ry="28" fill="#fff" stroke="#000" stroke-width="1.5"/>
<text class="t uc" x="800" y="480" text-anchor="middle">Transfer leadership</text>
<ellipse cx="800" cy="600" rx="145" ry="28" fill="#fff" stroke="#000" stroke-width="1.5"/>
<text class="t uc" x="800" y="600" text-anchor="middle">Use club workspace</text>
<ellipse cx="1100" cy="360" rx="145" ry="30" fill="#fff" stroke="#000" stroke-width="1.5"/>
<text class="t uc" x="1100" y="353" text-anchor="middle">Restrict or restore</text>
<text class="t uc" x="1100" y="367" text-anchor="middle">club</text>
<line x1="128" y1="242" x2="380" y2="160" stroke="#000" stroke-width="1.15"/>
<line x1="128" y1="242" x2="380" y2="250" stroke="#000" stroke-width="1.15"/>
<line x1="128" y1="242" x2="380" y2="360" stroke="#000" stroke-width="1.15"/>
<line x1="128" y1="242" x2="380" y2="460" stroke="#000" stroke-width="1.15"/>
<line x1="128" y1="242" x2="380" y2="560" stroke="#000" stroke-width="1.15"/>
<line x1="128" y1="242" x2="655" y2="600" stroke="#000" stroke-width="1.15"/>
<line x1="128" y1="542" x2="655" y2="220" stroke="#000" stroke-width="1.15"/>
<line x1="128" y1="542" x2="655" y2="360" stroke="#000" stroke-width="1.15"/>
<line x1="128" y1="542" x2="655" y2="480" stroke="#000" stroke-width="1.15"/>
<line x1="128" y1="542" x2="655" y2="600" stroke="#000" stroke-width="1.15"/>
<line x1="1272" y1="382" x2="1245" y2="360" stroke="#000" stroke-width="1.15"/>
<rect x="40" y="700" width="320" height="80" fill="#fff" stroke="#000" stroke-width="1"/>
<text class="t note" x="48" y="718">Restricted clubs cannot message,</text>
<text class="t note" x="48" y="732">invite, join, or link to events.</text>
<text class="t note" x="48" y="746">Members may still view and leave.</text>
</svg>