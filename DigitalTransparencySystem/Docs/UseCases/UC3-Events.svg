<text class="t rel" x="680.0" y="177.0" text-anchor="middle">&lt;&lt;include&gt;&gt;</text>
<rect x="40" y="800" width="360" height="70" fill="#fff" stroke="#000" stroke-width="1"/>
<text class="t note" x="48" y="818">Admin cannot create events.</text>
<text class="t note" x="48" y="832">Public join is a request. Event Admin</text>
<text class="t note" x="48" y="846">or Event Manager accepts members.</text>
