</style>
<rect x="0" y="0" width="1500" height="900" fill="#fff"/>
<text class="t title" x="750.0" y="36" text-anchor="middle">Figure UC-3. Campus events</text>
<text class="t sub" x="750.0" y="58" text-anchor="middle">Faculty and staff create events. Students propose. Admin approves proposals and may restrict records.</text>
