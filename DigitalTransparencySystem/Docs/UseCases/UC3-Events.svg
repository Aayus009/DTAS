<text class="t uc" x="1150" y="287" text-anchor="middle">proposal</text>
<ellipse cx="1150" cy="430" rx="145" ry="30" fill="#fff" stroke="#000" stroke-width="1.5"/>
<text class="t uc" x="1150" y="423" text-anchor="middle">Restrict or restore</text>
<text class="t uc" x="1150" y="437" text-anchor="middle">event</text>
<ellipse cx="1150" cy="580" rx="145" ry="30" fill="#fff" stroke="#000" stroke-width="1.5"/>
