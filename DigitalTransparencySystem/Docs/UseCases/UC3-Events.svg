<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="900" viewBox="0 0 1500 900">
<style>
  .t { font-family: 'Times New Roman', Times, serif; fill: #000; }
  .title { font-size: 22px; font-weight: bold; }
