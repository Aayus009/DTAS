<text class="t boxb" x="409.3" y="1258.0" text-anchor="middle">Sign-in code flow</text>
<rect x="650.7" y="1222.0" width="438.7" height="56.0" fill="#ffffff" stroke="#000000" stroke-width="1.4"/>
<text class="t boxb" x="870.0" y="1242.0" text-anchor="middle">Zoom API</text>
<text class="t boxb" x="870.0" y="1258.0" text-anchor="middle">Online meeting, recordings</text>
<rect x="1111.3" y="1222.0" width="438.7" height="56.0" fill="#ffffff" stroke="#000000" stroke-width="1.4"/>
<text class="t boxb" x="1330.7" y="1242.0" text-anchor="middle">Gmail SMTP</text>
<text class="t boxb" x="1330.7" y="1258.0" text-anchor="middle">OTP and email notices</text>
<text class="t cap" x="52.0" y="178.0">Web browser</text>
<text class="t cap" x="52.0" y="356.0">IIS host</text>
<text class="t cap" x="52.0" y="626.0">Every page</text>
<text class="t cap" x="52.0" y="786.0">Helpers</text>
<text class="t cap" x="52.0" y="1034.0">SQL Server</text>
<text class="t cap" x="52.0" y="1236.0">Outbound</text>
<text class="t cap" x="190.0" y="242.0">Signed-out guest uses public pages. Signed-in roles use a portal.</text>
<text class="t cap" x="190.0" y="506.0">Site.Master shows public chrome only when the user is not signed in.</text>
<text class="t cap" x="190.0" y="1336.0">Request path: Browser to IIS to Web Forms page to AccessGuard to a helper service to SQL Server.</text>
<text class="t cap" x="190.0" y="1364.0">Outbound path: AuthService calls Google. MeetingService calls Zoom. Notification and OTP call SMTP.</text>
<text class="t cap" x="190.0" y="1392.0">Governance flow: Event to Meeting to Decision to workspace Task to public Transparency gist.</text>
<text class="t cap" x="190.0" y="1420.0">Academic assignments sit beside that path. System admin does not create assignments or events.</text>
</svg>